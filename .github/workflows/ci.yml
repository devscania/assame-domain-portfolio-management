name: Domain Console CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: domainconsole
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: domainconsole_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U domainconsole -d domainconsole_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://domainconsole:test-only@127.0.0.1:5432/domainconsole_test
      TEST_DATABASE_URL: postgresql://domainconsole:test-only@127.0.0.1:5432/domainconsole_test
      AUTH_URL: http://localhost:3010
      PLAYWRIGHT_BASE_URL: http://localhost:3010
      AUTH_SECRET: ci-only-secret-not-for-production-00000000
      CREDENTIAL_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      DEMO_MODE: 'true'
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-TEST123 # Synthetic tag; browser requests are mocked.
      RENEWAL_REMINDERS_ENABLED: 'true'
      PROVIDER_WRITES_ENABLED: 'true' # Fixture-only publishing UI; no live credentials or mutation requests.
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '2526'
      SMTP_FROM: 'Web fixture <demo@example.test>'
      SMTP_REQUIRE_TLS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
